name: CI and Platform Releases

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  windows-release:
    name: Build Windows downloads
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.20,<7"

      - name: Build CLI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --paths . --collect-all imageio_ffmpeg --name stego-cli app.py

      - name: Build GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --paths . --collect-all imageio_ffmpeg --collect-all tkinterdnd2 --name stego-gui gui/main.py

      - name: Package Windows download
        shell: pwsh
        run: Compress-Archive -Path @('dist/stego-cli.exe', 'dist/stego-gui.exe') -DestinationPath 'dist/steganography-windows.zip' -Force

      - name: Attach Windows ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/steganography-windows.zip
          fail_on_unmatched_files: true

  macos-release:
    name: Build macOS downloads
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.20,<7"

      - name: Build CLI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --paths . --collect-all imageio_ffmpeg --name stego-cli app.py

      - name: Build GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --paths . --collect-all imageio_ffmpeg --collect-all tkinterdnd2 --name stego-gui gui/main.py

      - name: Package macOS download
        run: |
          mkdir -p dist/steganography-macos
          ditto dist/stego-cli dist/steganography-macos/stego-cli
          ditto dist/stego-gui.app dist/steganography-macos/stego-gui.app
          ditto -c -k --sequesterRsrc --keepParent dist/steganography-macos dist/steganography-macos.zip

      - name: Attach macOS ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/steganography-macos.zip
          fail_on_unmatched_files: true
