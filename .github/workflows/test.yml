name: Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  REQUIRE_TK: "1"

jobs:
  test:
    name: Test - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            xauth \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            tk \
            tk-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-cov

      - name: Run tests on Linux with Xvfb
        if: runner.os == 'Linux'
        env:
          CI: ""
          PYTHONPATH: ${{ github.workspace }}
        run: xvfb-run -a pytest -v --cov=stego --cov=gui --cov=app --cov-report=xml --cov-report=term tests/

      - name: Run tests on macOS and Windows
        if: runner.os != 'Linux'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v --cov=stego --cov=gui --cov=app --cov-report=xml --cov-report=term tests/

  docker-test:
    name: Docker test target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build test image
        run: docker build --target test -t stego-test .

      - name: Run tests in Docker with Xvfb
        run: docker run --rm stego-test

      - name: Build the runtime image
        run: docker build --target final -t stego-runtime .

      - name: Smoke test the unprivileged runtime image
        run: |
          docker run --rm --entrypoint sh stego-runtime -c 'test "$(id -u)" -ne 0 && touch /app/.write-check && rm /app/.write-check'
          docker run --rm stego-runtime --help
